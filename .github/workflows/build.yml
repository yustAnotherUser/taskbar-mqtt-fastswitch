name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish self-contained single-file binary
        run: >
          dotnet publish src/TaskbarMqtt.Linux/TaskbarMqtt.Linux.csproj -c Release -r linux-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/linux-x64

      - name: Rename artifact
        run: cp publish/linux-x64/taskbar-mqtt publish/taskbar-mqtt-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: taskbar-mqtt-linux-x64
          path: publish/taskbar-mqtt-linux-x64

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/taskbar-mqtt-linux-x64
          generate_release_notes: true

  build-windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build net48 exe
        run: dotnet build src/TaskbarMqtt/TaskbarMqtt.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: taskbar-mqtt-windows
          path: |
            src/TaskbarMqtt/bin/Release/TaskbarMqtt.exe
            src/TaskbarMqtt/bin/Release/TaskbarMqtt.exe.config

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/TaskbarMqtt/bin/Release/TaskbarMqtt.exe
            src/TaskbarMqtt/bin/Release/TaskbarMqtt.exe.config
          generate_release_notes: true
